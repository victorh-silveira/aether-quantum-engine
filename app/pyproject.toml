[project]
name = "aether-quantum-engine"
version = "0.0.0"
description = "Motor quantitativo assíncrono para a Deriv usando Deep Learning (TCN PyTorch) e controle de risco Kelly/martingale."
readme = "../README.md"
requires-python = ">=3.13.12,<3.13.13"

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "data",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "D",
    "S",
    "BLE",
    "FBT",
    "A",
    "COM",
    "T20",
    "Q",
    "RET",
    "SIM",
    "ARG",
    "PTH",
    "ERA",
    "PL",
]
ignore = [
    "E501",
    "D203",
    "D213",
    "ANN204",
    "PLR0913",
    "PLR2004",
    "COM812",
    "ISC001",
    "D1",
    "BLE001",
    "S105",
]

[tool.ruff.lint.pylint]
max-statements = 50

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
lines-after-imports = 2
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["T201", "E402", "S603", "S607", "S101"]
"run.py" = ["T201", "S101"]
"train.py" = ["T201", "S101"]
"src/infrastructure/api/deriv_http.py" = ["S310"]
"src/infrastructure/api/deriv_rest_client.py" = ["S310"]
"src/infrastructure/api/deriv_pat_binding.py" = ["S310"]
"src/infrastructure/api/deriv_pat_session.py" = ["S310"]
"src/infrastructure/inference/triton_http.py" = ["S310"]
"tests/**/*.py" = ["ARG001", "ARG005", "S101", "S106", "S310"]
"src/application/services/deep_learning/dl_features.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --timeout=90"
filterwarnings = []
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "torch_cuda: testes que exigem resolucao real de dispositivo CUDA",
    "real_settlement_watch: testes que executam _run_settlement_watch real",
    "docker: testes de integracao que exigem Redis, TimescaleDB e MinIO locais",
]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
fail-under = 100
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "scripts",
    "tests",
    "venv",
]

[tool.bandit]
skips = ["B105", "B106", "B310"]
exclude_dirs = [".git", ".venv", "tests", "venv", "scripts"]

[tool.coverage.run]
source = ["src"]
omit = []

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    'if __name__ == "__main__":',
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pass",
    "raise ImportError",
]

[tool.vulture]
exclude = []
ignore_decorators = []
ignore_names = []
min_confidence = 70
paths = ["src", "run.py", "train.py", "scripts", "aether_paths.py"]

