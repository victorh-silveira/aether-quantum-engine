name: Testes Pytest
description: Pytest + cobertura minima em src (gate em pyproject.toml)

runs:
  using: composite

  steps:
    - name: Configurar Python (.python-version)
      uses: actions/setup-python@v5
      with:
        python-version-file: app/.python-version
        cache: pip
        cache-dependency-path: |
          app/requirements.txt
          app/requirements-dev.txt

    - name: Instalar dependências (runtime e dev)
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt -r app/requirements-dev.txt

    - name: Executar suíte de testes e cobertura (100%)
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --stage test --coverage-fail-under 100
