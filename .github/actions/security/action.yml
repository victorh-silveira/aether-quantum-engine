name: Segurança do código
description: Bandit, pip-audit (CVEs) e varredura Gitleaks

runs:
  using: composite

  steps:
    - name: Configurar Python 3.13.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.13.12"
        cache: pip
        cache-dependency-path: |
          app/requirements.txt
          app/requirements-dev.txt

    - name: Liberar espaço em disco no runner
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift || true

    - name: Instalar ferramentas e dependências do projeto
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.10.0
        pip install -r app/requirements.txt -r app/requirements-dev.txt
        GITLEAKS_VERSION="8.24.2"
        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp
        sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
        gitleaks version

    - name: Clean workspace — segurança
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --stage security

    - name: Gitleaks — vazamento de segredos no repositório
      shell: bash
      run: gitleaks detect --source . --verbose --redact
