name: CI - Setup Python
description: Python 3.13 e dependencias de QA
inputs:
  install_app_deps:
    description: Instala requirements do app (torch CPU no extra-index)
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Python | Setup
      uses: actions/setup-python@v5
      with:
        python-version-file: app/.python-version
        cache: pip
        cache-dependency-path: |
          app/requirements.txt
          app/requirements-dev.txt
    - name: Python | Deps
      if: inputs.install_app_deps == 'true'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.10.0
        pip install -r app/requirements.txt -r app/requirements-dev.txt
