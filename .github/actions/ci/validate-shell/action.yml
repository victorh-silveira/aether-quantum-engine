name: CI - Scripts
description: Matriz crash-first bash via orquestrador
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: ./.github/actions/ci/setup-python
      with:
        install_app_deps: "false"
    - name: Instalar shellcheck
      shell: bash
      run: sudo apt-get update -y && sudo apt-get install -y shellcheck
    - name: Shell | Lint
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area shell --stage lint
    - name: Shell | Validate
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area shell --stage validate
    - name: Shell | Seguranca
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area shell --stage security
    - name: Shell | Testes
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area shell --stage test
    - name: Shell | Build
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area shell --stage build
