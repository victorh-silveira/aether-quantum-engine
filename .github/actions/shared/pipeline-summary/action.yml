name: Resumo do pipeline
description: Publica o estado das etapas em português no resumo do GitHub
inputs:
  python:
    required: true
  docker:
    required: true
  shell:
    required: true
  rust:
    required: true
  workflows:
    required: true
  release:
    required: true
  release_tag:
    required: false
    default: ""
  release_published:
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Resumo | Pipeline
      shell: bash
      env:
        RESULTADO_PYTHON: ${{ inputs.python }}
        RESULTADO_DOCKER: ${{ inputs.docker }}
        RESULTADO_SHELL: ${{ inputs.shell }}
        RESULTADO_RUST: ${{ inputs.rust }}
        RESULTADO_WORKFLOWS: ${{ inputs.workflows }}
        RESULTADO_PUBLICACAO: ${{ inputs.release }}
        VERSAO_PUBLICADA: ${{ inputs.release_published }}
        VERSAO_TAG: ${{ inputs.release_tag }}
      run: |
        traduzir() {
          case "$1" in
            success) echo "Aprovado" ;;
            failure) echo "Falhou" ;;
            cancelled) echo "Cancelado" ;;
            skipped) echo "Ignorado" ;;
            *) echo "Indisponível" ;;
          esac
        }
        {
          echo "## Resumo da integração e publicação"
          echo ""
          echo "| Etapa | Resultado |"
          echo "|-------|--------|"
          echo "| Python | $(traduzir "$RESULTADO_PYTHON") |"
          echo "| Docker | $(traduzir "$RESULTADO_DOCKER") |"
          echo "| Shell | $(traduzir "$RESULTADO_SHELL") |"
          echo "| Rust | $(traduzir "$RESULTADO_RUST") |"
          echo "| Fluxos de trabalho | $(traduzir "$RESULTADO_WORKFLOWS") |"
          echo "| Publicação | $(traduzir "$RESULTADO_PUBLICACAO") |"
          echo ""
          if [ "$VERSAO_PUBLICADA" = "true" ]; then
            printf 'Versão publicada: %s\n' "$VERSAO_TAG"
          else
            echo "Nenhuma versão nova foi publicada neste envio."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
