name: Resumo do pipeline
description: Publica o estado das etapas em português no resumo do GitHub
inputs:
  python:
    required: true
  docker:
    required: true
  shell:
    required: true
  rust:
    required: true
  workflows:
    required: true
  release:
    required: true
  release_tag:
    required: false
    default: ""
  release_published:
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Resumo | Pipeline
      shell: bash
      run: |
        traduzir() {
          case "$1" in
            success) echo "Aprovado" ;;
            failure) echo "Falhou" ;;
            cancelled) echo "Cancelado" ;;
            skipped) echo "Ignorado" ;;
            *) echo "Indisponível" ;;
          esac
        }
        {
          echo "## Resumo da integração e publicação"
          echo ""
          echo "| Etapa | Resultado |"
          echo "|-------|--------|"
          echo "| Python | $(traduzir '${{ inputs.python }}') |"
          echo "| Docker | $(traduzir '${{ inputs.docker }}') |"
          echo "| Shell | $(traduzir '${{ inputs.shell }}') |"
          echo "| Rust | $(traduzir '${{ inputs.rust }}') |"
          echo "| Fluxos de trabalho | $(traduzir '${{ inputs.workflows }}') |"
          echo "| Publicação | $(traduzir '${{ inputs.release }}') |"
          echo ""
          if [ "${{ inputs.release_published }}" = "true" ]; then
            echo "Versão publicada: \`${{ inputs.release_tag }}\`"
          else
            echo "Nenhuma versão nova foi publicada neste envio."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
