name: CI/CD - Indicador sintetico
on:
  push:
    branches: [codex/synthetic-indicator]
  pull_request:
    branches: [codex/synthetic-indicator]
permissions:
  contents: read
concurrency:
  group: indicator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: python -m pip install -r app/requirements-dev.txt
      - run: make lint
      - run: make test
      - run: docker compose -f infra/docker/docker-compose.yml config --quiet
      - run: docker build -f app/Dockerfile -t aether-indicator:ci .
      - name: Validar dashboards
        run: python -c 'import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path("infra/docker/grafana/provisioning/dashboards").glob("*.json")]; assert list(pathlib.Path("infra/docker/grafana/provisioning/dashboards").glob("*.json"))'

  preview:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-indicator:preview-${{ github.sha }}
