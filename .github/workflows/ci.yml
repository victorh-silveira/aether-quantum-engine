name: CI/CD - Pipeline principal

on:
  push:
    branches: [codex/synthetic-indicator]
  pull_request:
    branches: [codex/synthetic-indicator]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: CI - Python
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Instalar dependencias
        run: python -m pip install -r app/requirements-dev.txt pyyaml==6.0.3
      - name: Instalar Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Python | Lint
        run: make lint
      - name: Python | JSON Lint
        run: python -m json.tool config/settings.json >/dev/null
      - name: Python | YAML Lint
        run: python -c 'import pathlib,yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path(".github/workflows").glob("*.yml")]; yaml.safe_load(pathlib.Path("infra/docker/docker-compose.yml").read_text())'
      - name: Python | Validate
        run: python -m compileall -q app/src app/run.py app/train.py
      - name: Python | JSON Validate
        run: python -c 'import json,pathlib; files=list(pathlib.Path("infra/docker/grafana/provisioning/dashboards").glob("*.json")); assert files; [json.loads(p.read_text()) for p in files]'
      - name: Python | YAML Validate
        run: docker compose -f infra/docker/docker-compose.yml config --quiet
      - name: Python | Seguranca
        run: |
          gitleaks dir --no-banner --redact --config .gitleaks.toml .
          python -m ruff check --select S --ignore S104 app/src app/run.py app/train.py
      - name: Python | Testes
        run: make test
      - name: Python | JSON Testes
        run: python -m pytest app/tests/test_architecture.py -q
      - name: Python | Build
        run: python -m compileall -q app/src app/run.py app/train.py

  docker:
    name: CI - Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
      - name: Instalar Hadolint
        run: |
          curl -fsSL -o /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint
          sudo mv /tmp/hadolint /usr/local/bin/hadolint
      - name: Instalar Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.74.0
      - name: Docker | Lint
        run: hadolint app/Dockerfile
      - name: Docker | Validate
        run: docker compose -f infra/docker/docker-compose.yml config --quiet
      - name: Docker | Seguranca
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 app/Dockerfile
      - name: Docker | Build
        run: docker build -f app/Dockerfile -t aether-indicator:ci .
      - name: Docker | Testes
        run: docker run --rm aether-indicator:ci python -c 'import app.src.indicator; print("indicator import ok")'

  shell:
    name: CI - Shell
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
      - name: Instalar ShellCheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck
      - name: Shell | Lint e Validate
        run: |
          mapfile -d '' files < <(find . -path './.git' -prune -o -path './.venv' -prune -o -type f \( -name '*.sh' -o -name '*.bash' \) -print0)
          if ((${#files[@]})); then shellcheck "${files[@]}"; fi
          for file in "${files[@]}"; do bash -n "$file"; done
      - name: Shell | Seguranca, Testes e Build
        run: make -n lint test

  rust:
    name: CI - Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
      - name: Rust | Verificar componentes
        run: |
          if find . -path './.git' -prune -o -path './.venv' -prune -o -type f \( -name '*.rs' -o -name 'Cargo.toml' \) -print | grep -q .; then
            echo 'Codigo Rust encontrado; configure fmt, clippy, testes e build antes de integrar.' >&2
            exit 1
          fi
          echo 'Sem componentes Rust na branch do indicador.'

  workflows:
    name: CI - Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
      - name: Workflows | Lint
        uses: ./.github/actions/ci/workflows

  release:
    name: CI - Publicação
    needs: [python, docker, shell, rust, workflows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/synthetic-indicator'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKER_BUILD_SUMMARY: 'false'
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.image.outputs.tag }}
      published: ${{ steps.publicar.outcome == 'success' }}
    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
      - name: Publicação | Preparar imagem de prévia
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-indicator:preview-${GITHUB_SHA}"
          echo "tag=$image" >> "$GITHUB_OUTPUT"
      - name: Publicação | Autenticar GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicação | Enviar imagem de prévia
        id: publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}
      - name: Publicação | Resumo
        if: always()
        env:
          IMAGEM_RESULTADO: ${{ steps.publicar.outcome }}
          IMAGEM_TAG: ${{ steps.image.outputs.tag }}
          IMAGEM_DIGEST: ${{ steps.publicar.outputs.digest }}
        run: |
          {
            echo '## Publicação da imagem de prévia'
            echo ''
            if [ "$IMAGEM_RESULTADO" = 'success' ]; then
              echo 'Resultado: imagem publicada com sucesso.'
              printf 'Imagem: `%s`\n' "$IMAGEM_TAG"
              printf 'Identificador: `%s`\n' "$IMAGEM_DIGEST"
            else
              echo 'Resultado: imagem não publicada.'
              echo 'Consulte as etapas anteriores para identificar a falha.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  pipeline-summary:
    name: CI - Resumo
    needs: [python, docker, shell, rust, workflows, release]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/codex/synthetic-indicator'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resumo | Pipeline
        env:
          RESULTADO_PYTHON: ${{ needs.python.result }}
          RESULTADO_DOCKER: ${{ needs.docker.result }}
          RESULTADO_SHELL: ${{ needs.shell.result }}
          RESULTADO_RUST: ${{ needs.rust.result }}
          RESULTADO_WORKFLOWS: ${{ needs.workflows.result }}
          RESULTADO_PUBLICACAO: ${{ needs.release.result }}
          IMAGEM_PUBLICADA: ${{ needs.release.outputs.published }}
          IMAGEM_TAG: ${{ needs.release.outputs.tag }}
        run: |
          traduzir() {
            case "$1" in
              success) echo 'Aprovado' ;;
              failure) echo 'Falhou' ;;
              cancelled) echo 'Cancelado' ;;
              skipped) echo 'Ignorado' ;;
              *) echo 'Indisponível' ;;
            esac
          }
          {
            echo '## Resumo da integração e publicação'
            echo ''
            echo '| Etapa | Resultado |'
            echo '|-------|--------|'
            echo "| Python | $(traduzir "$RESULTADO_PYTHON") |"
            echo "| Docker | $(traduzir "$RESULTADO_DOCKER") |"
            echo "| Shell | $(traduzir "$RESULTADO_SHELL") |"
            echo "| Rust | $(traduzir "$RESULTADO_RUST") |"
            echo "| Fluxos de trabalho | $(traduzir "$RESULTADO_WORKFLOWS") |"
            echo "| Publicação | $(traduzir "$RESULTADO_PUBLICACAO") |"
            echo ''
            if [ "$IMAGEM_PUBLICADA" = 'true' ]; then
              printf 'Imagem de prévia publicada: `%s`\n' "$IMAGEM_TAG"
            else
              echo 'Nenhuma imagem de prévia foi publicada neste envio.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
