name: CI/CD - Pipeline principal
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - ".pre-commit-config.yaml"
      - "linters/**"
      - "Makefile"
      - "README.md"
      - "docs/**"
      - "config/**"
      - "infra/**"
      - "app/**"
      - "run.py"
      - "train.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
      - ".pre-commit-config.yaml"
      - "linters/**"
      - "Makefile"
      - "README.md"
      - "docs/**"
      - "config/**"
      - "infra/**"
      - "app/**"
      - "run.py"
      - "train.py"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: CI - Python
    if: ${{ github.event_name != 'push' || (github.event.head_commit != null && !contains(github.event.head_commit.message, 'Merge branch') && !contains(github.event.head_commit.message, 'merge origin/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Python
        uses: ./.github/actions/ci/setup-python
      - name: Liberar espaco em disco no runner
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift || true
      - name: Instalar Gitleaks
        shell: bash
        run: |
          GITLEAKS_VERSION="8.24.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Instalar actionlint
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          sudo mv actionlint /usr/local/bin/actionlint
      - name: Python | Lint
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area python --stage lint
      - name: Python | JSON Lint
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area python --stage lint --config-text json
      - name: Python | YAML Lint
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area python --stage lint --config-text yaml
      - name: Python | Validate
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area python --stage validate
      - name: Python | JSON Validate
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area python --stage validate --config-text json
      - name: Python | YAML Validate
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area python --stage validate --config-text yaml
      - name: Python | Seguranca
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area python --stage security
      - name: Python | Testes
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area python --stage test --coverage-fail-under 100
      - name: Python | JSON Testes
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area python --stage test --config-text json
      - name: Python | Build
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area python --stage build

  docker:
    name: CI - Docker
    if: ${{ github.event_name != 'push' || (github.event.head_commit != null && !contains(github.event.head_commit.message, 'Merge branch') && !contains(github.event.head_commit.message, 'merge origin/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
      - name: Setup Python
        uses: ./.github/actions/ci/setup-python
        with:
          install_app_deps: "false"
      - name: Instalar Hadolint
        shell: bash
        run: |
          curl -fsSL -o /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint
          sudo mv /tmp/hadolint /usr/local/bin/hadolint
      - name: Instalar Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.74.0
      - name: Docker | Lint
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area docker --stage lint
      - name: Docker | Validate
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area docker --stage validate
      - name: Docker | Seguranca
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area docker --stage security
      - name: Docker | Testes
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area docker --stage test
      - name: Docker | Build
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area docker --stage build

  shell:
    name: CI - Shell
    if: ${{ github.event_name != 'push' || (github.event.head_commit != null && !contains(github.event.head_commit.message, 'Merge branch') && !contains(github.event.head_commit.message, 'merge origin/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
      - name: Setup Python
        uses: ./.github/actions/ci/setup-python
        with:
          install_app_deps: "false"
      - name: Instalar shellcheck
        shell: bash
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck
      - name: Shell | Lint
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area shell --stage lint
      - name: Shell | Validate
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area shell --stage validate
      - name: Shell | Seguranca
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area shell --stage security
      - name: Shell | Testes
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area shell --stage test
      - name: Shell | Build
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area shell --stage build

  release:
    name: CI - Release
    needs: [python, docker, shell]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit != null && !contains(github.event.head_commit.message, 'Merge branch') && !contains(github.event.head_commit.message, 'merge origin/'))) && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    outputs:
      tag: ${{ steps.after_tag.outputs.tag }}
      published: ${{ steps.after_tag.outputs.published }}
    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Capturar tag anterior
        id: before_tag
        shell: bash
        run: |
          git fetch --tags --force
          BEFORE="$(git describe --tags --abbrev=0 2>/dev/null || echo __none__)"
          echo "tag=${BEFORE}" >> "$GITHUB_OUTPUT"
      - name: Sincronizar tags
        uses: ./.github/actions/ci/sync-tags
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Release semantica
        uses: ./.github/actions/ci/release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Capturar tag apos release
        id: after_tag
        shell: bash
        run: |
          git fetch origin main --tags --force
          NEW="$(git describe --tags --abbrev=0 2>/dev/null || echo __none__)"
          echo "tag=${NEW}" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.before_tag.outputs.tag }}" != "$NEW" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  pipeline-summary:
    name: CI/CD - Resumo
    needs: [python, docker, shell, release]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
      - name: Resumo do pipeline
        uses: ./.github/actions/shared/pipeline-summary
        with:
          python: ${{ needs.python.result }}
          docker: ${{ needs.docker.result }}
          shell: ${{ needs.shell.result }}
          release: ${{ needs.release.result }}
          release_tag: ${{ needs.release.outputs.tag }}
          release_published: ${{ needs.release.outputs.published }}
