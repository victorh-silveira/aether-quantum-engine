# SSOT: infra/docker/config/redis.conf
include /usr/local/etc/redis/config/redis.conf

# Fallback se executado localmente sem montagem de pasta config
appendonly yes
appendfsync everysec
save ""
maxmemory 200mb
maxmemory-policy noeviction
io-threads 2
io-threads-do-reads yes
tcp-backlog 2048
tcp-keepalive 60
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
