apiVersion: 1

datasources:
  - name: Timescale Trading
    uid: timescale
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: ${AETHER_PG_USER}
    secureJsonData:
      password: ${AETHER_PG_PASSWORD}
    jsonData:
      database: ${AETHER_PG_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    editable: false
