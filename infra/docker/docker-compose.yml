x-logging: &aether-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7.4.2-alpine
    container_name: aether-redis
    profiles: [core]
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - aether_redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    mem_limit: 256m
    cpus: 0.50
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging: *aether-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - aether-net

  timescaledb:
    image: timescale/timescaledb:2.28.2-pg16
    container_name: aether-timescaledb
    profiles: [core]
    restart: unless-stopped
    command:
      [
        "postgres",
        "-c",
        "checkpoint_completion_target=0.95",
        "-c",
        "max_wal_size=2GB",
      ]
    environment:
      POSTGRES_USER: ${AETHER_PG_USER:-aether}
      POSTGRES_PASSWORD: ${AETHER_PG_PASSWORD:-aether}
      POSTGRES_DB: ${AETHER_PG_DB:-aether}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aether_ts_data:/var/lib/postgresql/data
      - ./002_aether-io-tune.sql:/docker-entrypoint-initdb.d/002_aether-io-tune.sql:ro
      - ./003_init-timescale.sql:/docker-entrypoint-initdb.d/003_init-timescale.sql:ro
      - ./004_timescale-lifecycle.sql:/docker-entrypoint-initdb.d/004_timescale-lifecycle.sql:ro
      - ./004_timescale-lifecycle.sql:/docker-scripts/004_timescale-lifecycle.sql:ro
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging: *aether-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AETHER_PG_USER:-aether} -d ${AETHER_PG_DB:-aether}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - aether-net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: aether-minio
    profiles: [core]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AETHER_MINIO_ACCESS_KEY:-aether}
      MINIO_ROOT_PASSWORD: ${AETHER_MINIO_SECRET_KEY:-aethersecret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - aether_minio_data:/data
    mem_limit: 512m
    cpus: 0.50
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging: *aether-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - aether-net

  aether-meta-classifier:
    build:
      context: ./meta-classifier
      dockerfile: Dockerfile
    container_name: aether-meta-classifier
    profiles: [ml]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    ports:
      - "127.0.0.1:8005:8000"
    volumes:
      - ./meta-models:/models
    environment:
      META_RETRAIN_MIN_N: "2"
      META_MAX_BUFFER: "2000"
    mem_limit: 512m
    cpus: 0.75
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 4096
        hard: 4096
    stop_grace_period: 10s
    logging: *aether-logging
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, sys; r=urllib.request.urlopen('http://localhost:8000/health'); sys.exit(0 if r.getcode()==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - aether-net

  aether-loss-classifier:
    build:
      context: ./loss-classifier
      dockerfile: Dockerfile
    container_name: aether-loss-classifier
    profiles: [ml]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    ports:
      - "127.0.0.1:8006:8000"
    volumes:
      - ./loss-models:/models
    environment:
      LOSS_FEATURE_DIM: "24"
      LOSS_READY_N: "8"
      LOSS_RETRAIN_MIN_N: "1"
      LOSS_BOOTSTRAP_EXIT_N: "8"
      LOSS_RETRAIN_ON_LOSS_MIN_N: "1"
      LOSS_MIN_WIN_FOR_LOSS_RETRAIN: "1"
      LOSS_MAX_BUFFER: "2000"
      LOSS_VETO_P_LOSS_FLOOR: "0.65"
    mem_limit: 512m
    cpus: 0.75
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 4096
        hard: 4096
    stop_grace_period: 10s
    logging: *aether-logging
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request, sys; response = urllib.request.urlopen('http://localhost:8000/health'); payload = json.loads(response.read().decode()); sys.exit(0 if response.getcode() == 200 and payload.get('ready') else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - aether-net

volumes:
  aether_redis_data:
  aether_ts_data:
  aether_minio_data:

networks:
  aether-net:
    driver: bridge
