services:
  redis:
    image: redis:7.4.2-alpine
    container_name: aether-redis
    profiles: [core]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - aether_redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - aether-net

  timescaledb:
    image: timescale/timescaledb:2.28.2-pg16
    container_name: aether-timescaledb
    profiles: [core]
    command:
      [
        "postgres",
        "-c",
        "checkpoint_completion_target=0.95",
        "-c",
        "max_wal_size=2GB",
      ]
    environment:
      POSTGRES_USER: ${AETHER_PG_USER:-aether}
      POSTGRES_PASSWORD: ${AETHER_PG_PASSWORD:-aether}
      POSTGRES_DB: ${AETHER_PG_DB:-aether}
    ports:
      - "5432:5432"
    volumes:
      - aether_ts_data:/var/lib/postgresql/data
      - ./002_aether-io-tune.sql:/docker-entrypoint-initdb.d/002_aether-io-tune.sql:ro
      - ./003_init-timescale.sql:/docker-entrypoint-initdb.d/003_init-timescale.sql:ro
      - ./004_timescale-lifecycle.sql:/docker-entrypoint-initdb.d/004_timescale-lifecycle.sql:ro
      - ./004_timescale-lifecycle.sql:/docker-scripts/004_timescale-lifecycle.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AETHER_PG_USER:-aether} -d ${AETHER_PG_DB:-aether}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - aether-net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: aether-minio
    profiles: [core, gpu]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AETHER_MINIO_ACCESS_KEY:-aether}
      MINIO_ROOT_PASSWORD: ${AETHER_MINIO_SECRET_KEY:-aethersecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aether_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - aether-net

  aether-triton:
    image: nvcr.io/nvidia/tritonserver:24.10-py3
    container_name: aether-triton
    profiles: [gpu]
    command:
      [
        "tritonserver",
        "--model-repository=/models",
        "--model-control-mode=explicit",
        "--load-model=*",
        "--strict-readiness=false",
        "--exit-on-error=false",
        "--allow-gpu-metrics=true",
      ]
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./triton-models:/models
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; import sys; response = urllib.request.urlopen('http://localhost:8000/v2/health/live'); sys.exit(0 if response.getcode() == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    networks:
      - aether-net

  aether-meta-classifier:
    build:
      context: ./meta-classifier
      dockerfile: Dockerfile
    container_name: aether-meta-classifier
    profiles: [ml]
    ports:
      - "8005:8000"
    volumes:
      - ./meta-models:/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request, sys; response = urllib.request.urlopen('http://localhost:8000/health'); payload = json.loads(response.read().decode()); sys.exit(0 if response.getcode() == 200 and payload.get('ready') else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - aether-net

volumes:
  aether_redis_data:
  aether_ts_data:
  aether_minio_data:

networks:
  aether-net:
    driver: bridge
