global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "aether_quantum_engine"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9100"]
  - job_name: "aether_synthetic_indicator"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["aether-market-signal-indicator:9101"]
