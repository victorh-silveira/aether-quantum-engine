apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Timescale
    uid: timescale
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: aether
    secureJsonData:
      password: aether
    jsonData:
      database: aether
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    editable: false
